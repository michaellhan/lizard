# Check, build and publish Lizard to GitHub Pages. This repo has no CNAME, so Pages serves it under the account's
# custom domain at https://www.michael-han.com/lizard/ (the homepage, /gto-solver/ and /gto-solver-library/ are other
# repos and are not touched). The precomputed library is a separate repo (scripts/library/publish.sh).
name: deploy

on:
  push:
    branches: [main]
    # Words alone change nothing the site serves. A push that touches anything else still runs everything. PROGRESS.md and
    # the rest of docs/ aren't in the build (no file under web/ or scripts/ reads them; checked 2026-11-06).
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Four kinds of check side by side, so a deploy waits on the slowest, not on all of them in a row: the unit tests,
  # the Python ones, and the site built once and its browser tests split over four machines (each test runs on one;
  # each machine still runs one test at a time, as each page boots a solver).
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck, lint, unit tests
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Pyodide staging tests (pins, verification, what the published worker names)
        run: npm run test:scripts
      - name: Sync service tests (the Worker on its real schema, D1 stood in for by SQLite; nothing here deploys it)
        working-directory: worker
        run: ../node_modules/.bin/tsc --noEmit -p . && ../node_modules/.bin/vitest run --root . src

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Python dependencies (the solver bundle and its quick tests)
        run: python -m pip install --disable-pip-version-check numpy==2.0.2 treys==0.1.8
      - name: Library assembler tests
        run: python -m unittest discover -s scripts/library
      - name: Engine contract tests (what Lizard reads from the engine's tournament answer; the prize model only)
        run: python -m unittest discover -s scripts/engine
      - name: Benchmark reference tests (the reference's own games and rules; the benchmark itself runs by hand)
        run: python -m unittest discover -s scripts/benchmarks
      - name: Solver quick tests (the ones that need neither the library nor minutes of CPU)
        working-directory: solver
        run: |
          PYTHONPATH=. python -m unittest tests.test_bundle tests.test_routes
          node --test tests/js/routes.test.js tests/js/solver_state.test.js

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Python dependencies (the solver bundle)
        run: python -m pip install --disable-pip-version-check numpy==2.0.2 treys==0.1.8
      - run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
        env:
          VITE_SYNC: ${{ vars.LIZARD_SYNC }}
      - name: The built site, for the browser tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: web/dist
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: web/dist
          retention-days: 1

  e2e:
    # (not ubuntu-latest: that moved to 26.04, which Playwright 1.56.1 has no Chromium for, and the browser tests gate the deploy)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: web/dist
      - name: Browser tests, a quarter of them (every route at three widths, and the flows on the real worker)
        run: |
          npx -w web playwright install --with-deps chromium
          npm -w web run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: web/e2e-results
          retention-days: 7

  deploy:
    # (main only: a manual run on another branch checks it and publishes nothing)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [unit, python, build, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
