# Check, build and publish Lizard to GitHub Pages. This repo has no CNAME, so Pages serves it under the account's
# custom domain at https://www.michael-han.com/lizard/ (the homepage, /gto-solver/ and /gto-solver-library/ are other
# repos and are not touched). The precomputed library is a separate repo (scripts/library/publish.sh).
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    # (not ubuntu-latest: that moved to 26.04, which Playwright 1.56.1 has no Chromium for, and the browser tests gate the deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Python dependencies (the solver bundle and its quick tests)
        run: python -m pip install --disable-pip-version-check numpy==2.0.2 treys==0.1.8
      - run: npm ci --ignore-scripts
      - name: Typecheck, lint, unit tests
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Pyodide staging tests (pins, verification, what the published worker names)
        run: npm run test:scripts
      - name: Library assembler tests
        run: python -m unittest discover -s scripts/library
      - name: Engine contract tests (what Lizard reads from the engine's tournament answer; the prize model only)
        run: python -m unittest discover -s scripts/engine
      - name: Benchmark reference tests (the reference's own games and rules; the benchmark itself runs by hand)
        run: python -m unittest discover -s scripts/benchmarks
      - name: Solver quick tests (the ones that need neither the library nor minutes of CPU)
        working-directory: solver
        run: |
          PYTHONPATH=. python -m unittest tests.test_bundle tests.test_routes
          node --test tests/js/routes.test.js tests/js/solver_state.test.js
      - name: Build
        run: npm run build
      - name: Browser tests (every route at three widths, and the flows on the real worker)
        run: |
          npx -w web playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-results
          path: web/e2e-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: web/dist
          retention-days: 1

  deploy:
    # (main only: a manual run on another branch checks it and publishes nothing)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
