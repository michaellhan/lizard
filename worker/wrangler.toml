# No secrets here: database_id is an identifier, and secrets go in with `wrangler secret put`.
name = "lizard-sync"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "www.michael-han.com/lizard/api/*", zone_name = "michael-han.com" }]

[vars]
SITE_ORIGIN = "https://www.michael-han.com"
GOOGLE_CLIENT_ID = "SET_WHEN_CREATED"

[triggers]
crons = ["17 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lizard-sync"
database_id = "13d02dd7-86f6-4846-a573-538cad9d313b"
